<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulario</h1>
        <p> Apresentação do formulario</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="video.html">Video</a>
    </nav>
    <main>
        <section>
            <h2>Formulario de Contato</h2>
            <p>Preencha o formulário abaixo:</p>
            <form action="#" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" requiered>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
             

               
                <fieldset>
                    <legend>Recomendaria a pizzaria Bottega Gradiz?</legend>
                    <label class="opcao">
                    <input type="radio" name="recomendaria" value="sim" required> Sim
                    </label>
                    <label class="opcao">
                    <input type="radio" name="recomendaria" value="nao" required> Não
                    </label>
                </fieldset>
                <p></p>
                 <label for="mensagem">Mensagem:</label>
                 
                <textarea id="mensagem" name="mensagem" rows="5"></textarea>
               
                

                <label class="opcao">
                    <input type="checkbox" name="novidade"> quero receber novidades
                </label>
                <div class="botoes">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </div>

                
            </form>
        </section>
    </main>
     <footer>
             <p> Desenvolvido por Mayara De Souza Gradiz Alves </p>
            </footer>
</body>
</html>s
